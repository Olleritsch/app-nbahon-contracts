name: Validate OpenAPI Contracts

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Test Bundling and Spectral Linting
        run: npm test

      - name: Checkout main for Breaking Change Check
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch
        continue-on-error: true

      - name: Check for Breaking Changes with oasdiff
        id: check-breaking
        run: |
          # 1. NatStat Connector Breaking Change Check
          NATSTAT_BASE=""
          if [ -f "main-branch/contracts/connectors/natstat/v1/openapi.yaml" ]; then
            NATSTAT_BASE="main-branch/contracts/connectors/natstat/v1/openapi.yaml"
          elif [ -f "main-branch/contracts/v1/openapi.yaml" ]; then
            NATSTAT_BASE="main-branch/contracts/v1/openapi.yaml"
          fi

          if [ -n "$NATSTAT_BASE" ] && [ -f "contracts/connectors/natstat/v1/openapi.yaml" ]; then
            echo "Checking NatStat Connector against base ($NATSTAT_BASE)..."
            npx @redocly/cli bundle "$NATSTAT_BASE" -o dist/natstat-base.yaml
            npx @redocly/cli bundle contracts/connectors/natstat/v1/openapi.yaml -o dist/natstat-revision.yaml
            docker run --rm -v $(pwd):/work:ro tufin/oasdiff -base /work/dist/natstat-base.yaml -revision /work/dist/natstat-revision.yaml -breaking -fail-on-diff
          fi

          # 2. Core BFF Breaking Change Check (falls bereits auf main vorhanden)
          if [ -f "main-branch/contracts/core/v1/openapi.yaml" ] && [ -f "contracts/core/v1/openapi.yaml" ]; then
            echo "Checking Core BFF against base..."
            npx @redocly/cli bundle main-branch/contracts/core/v1/openapi.yaml -o dist/core-base.yaml
            npx @redocly/cli bundle contracts/core/v1/openapi.yaml -o dist/core-revision.yaml
            docker run --rm -v $(pwd):/work:ro tufin/oasdiff -base /work/dist/core-base.yaml -revision /work/dist/core-revision.yaml -breaking -fail-on-diff
          fi
