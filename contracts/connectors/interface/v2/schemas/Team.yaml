type: object
description: Repräsentiert ein NBA-Team.
required:
  - name
  - abbreviation
properties:
  name:
    type: string
    description: Vollständiger Name des Teams.
    example: "Boston Celtics"
  city:
    type: string
    description: Stadt oder Region des Teams.
    example: "Boston"
  abbreviation:
    type: string
    description: Offizielles 3-Buchstaben-Kürzel (TLA) des Teams.
    example: "BOS"
