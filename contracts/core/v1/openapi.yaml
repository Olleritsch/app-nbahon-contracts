openapi: 3.1.0
info:
  title: nbahon Core BFF API Contracts
  version: 1.0.0
  description: Zentrale Frontend-Facing BFF-Schnittstelle des nbahon-Ökosystems.
  contact:
    name: Oliver (@Olleritsch)
servers:
  - url: http://localhost:8080
    description: Lokale Entwicklung
tags:
  - name: Core Gamedays
    description: Aggregierte Spieltagsdaten für Frontend-Clients
  - name: Core Games
    description: Detailansichten und Analysen einzelner Partien
paths:
  /api/v1/core/gamedays/{date}:
    $ref: './paths/gamedays.yaml'
  /api/v1/core/games/{date}/{matchup}:
    $ref: './paths/games.yaml'
components:
  schemas:
    AggregatedGameday:
      $ref: './schemas/AggregatedGameday.yaml'
    AggregatedGame:
      $ref: './schemas/AggregatedGame.yaml'
    AggregatedGameView:
      $ref: './schemas/AggregatedGameView.yaml'
    TeamOverview:
      $ref: './schemas/TeamOverview.yaml'
    ScoreSummary:
      $ref: './schemas/ScoreSummary.yaml'
    MatchupOverview:
      $ref: './schemas/MatchupOverview.yaml'
    GameAnalysis:
      $ref: './schemas/GameAnalysis.yaml'
    ProblemDetail:
      $ref: './schemas/ProblemDetail.yaml'

