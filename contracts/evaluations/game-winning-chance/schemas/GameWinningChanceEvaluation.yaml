type: object
description: Ergebnis der GameWinningChanceEvaluation eines Spiels inklusive Spannungs-Score, Rating, strukturierter Zusammenfassung und erkannten spielentscheidenden Phasen.
required:
  - score
  - rating
  - summary
  - gameWinningChances
properties:
  score:
    type: integer
    minimum: 0
    maximum: 100
    description: Berechneter Spannungswert dieser Evaluation auf einer Skala von 0 bis 100.
    example: 46
  rating:
    $ref: '../../../common/schemas/EvaluationRating.yaml'
  summary:
    $ref: '../../../common/schemas/EvaluationSummaryDetail.yaml'
  gameWinningChances:
    type: array
    description: Alle ermittelten spielentscheidenden Phasen des Spiels (chronologisch nach Periode).
    items:
      $ref: './GameWinningChance.yaml'
