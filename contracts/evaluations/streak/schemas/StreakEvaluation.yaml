type: object
description: Ergebnis der StreakEvaluation eines Spiels inklusive Spannungs-Score, Rating, strukturierter Zusammenfassung (mit allen ausgelösten Faktoren in summary.reasons) sowie Team-Serien und Head-to-Head-Kontext.
required:
  - score
  - rating
  - summary
  - awayTeamContext
  - homeTeamContext
  - headToHead
properties:
  score:
    type: integer
    minimum: 0
    maximum: 100
    description: Berechneter Spannungswert dieser Evaluation auf einer Skala von 0 bis 100.
    example: 53
  rating:
    $ref: '../../../common/schemas/EvaluationRating.yaml'
  summary:
    $ref: '../../../common/schemas/EvaluationSummaryDetail.yaml'
  awayTeamContext:
    $ref: './TeamStreakContext.yaml'
  homeTeamContext:
    $ref: './TeamStreakContext.yaml'
  headToHead:
    $ref: './HeadToHeadContext.yaml'
