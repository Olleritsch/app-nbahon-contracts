type: object
required:
  - date
  - totalGames
  - games
properties:
  date:
    type: string
    format: date
    example: '2026-10-21'
  totalGames:
    type: integer
    example: 8
  liveGames:
    type: integer
    example: 2
  completedGames:
    type: integer
    example: 4
  upcomingGames:
    type: integer
    example: 2
  games:
    type: array
    items:
      $ref: './AggregatedGame.yaml'

