get:
  summary: Spieltag mit Spielen und Metadaten abrufen
  description: Liefert einen vollständigen NBA-Spieltag für das angegebene Datum (ISO-8601).
  operationId: getGameday
  tags:
    - Gamedays
  parameters:
    - name: date
      in: path
      required: true
      description: Kalendertag des Spieltags im Format YYYY-MM-DD.
      schema:
        type: string
        format: date
        example: "2026-04-12"
  responses:
    '200':
      description: Erfolgreiche Rückgabe des Spieltags.
      content:
        application/json:
          schema:
            $ref: '../schemas/Gameday.yaml'
    '400':
      description: Ungültige Anfrage oder fehlerhaftes Datumsformat.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/ProblemDetail.yaml'
    '500':
      description: Unerwarteter interner Serverfehler.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/ProblemDetail.yaml'

