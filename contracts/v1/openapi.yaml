openapi: 3.1.0
info:
  title: nbahon API Contracts
  version: 1.2.0
  description: Zentrale Schnittstellenverträge für das NBA-Ökosystem von nbahon.
  contact:
    name: Oliver (@Olleritsch)
servers:
  - url: http://localhost:8080
    description: Lokale Entwicklung

tags:
  - name: Gamedays
    description: Endpunkte zur Abfrage von NBA-Spieltagen und Partien
  - name: Games
    description: Endpunkte zur Abfrage von Spieldetails und Boxscores
  - name: Teams
    description: Endpunkte zur Abfrage von NBA-Teams

paths:
  /api/gamedays/{date}/games:
    $ref: './paths/gamedays.yaml'
  /api/gamedays/{date}/games/{matchup}:
    $ref: './paths/game-details.yaml'
  /api/gamedays/{date}/games/{matchup}/boxscore:
    $ref: './paths/boxscore.yaml'
  /api/teams:
    $ref: './paths/teams.yaml'

components:
  schemas:
    Game:
      $ref: './schemas/Game.yaml'
    GameStatus:
      $ref: './schemas/GameStatus.yaml'
    Team:
      $ref: './schemas/Team.yaml'
    Venue:
      $ref: './schemas/Venue.yaml'
    TimeZoneInfo:
      $ref: './schemas/TimeZoneInfo.yaml'
    Score:
      $ref: './schemas/Score.yaml'
    ProblemDetail:
      $ref: './schemas/ProblemDetail.yaml'
    TeamGameStats:
      $ref: './schemas/TeamGameStats.yaml'
    PlayerBoxscore:
      $ref: './schemas/PlayerBoxscore.yaml'
    Boxscore:
      $ref: './schemas/Boxscore.yaml'
    GameDetails:
      $ref: './schemas/GameDetails.yaml'

