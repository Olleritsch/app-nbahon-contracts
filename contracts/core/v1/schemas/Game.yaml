type: object
description: Spieldaten einer NBA-Partie.
required:
  - status
  - homeTeam
  - awayTeam
properties:
  status:
    type: string
    enum: [SCHEDULED, IN_PROGRESS, FINAL, POSTPONED, CANCELLED]
    example: 'FINAL'
  startTime:
    type: string
    format: date-time
    example: '2026-10-21T19:30:00Z'
  homeTeam:
    $ref: './Team.yaml'
  awayTeam:
    $ref: './Team.yaml'
  score:
    $ref: './Score.yaml'
  venue:
    type: string
    example: 'TD Garden, Boston'
  boxscore:
    type: object
    description: Detaillierte Boxscore-Daten der Partie.
