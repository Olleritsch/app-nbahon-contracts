type: object
description: Repräsentiert ein NBA-Team.
required:
  - name
  - city
  - abbreviation
properties:
  name:
    type: string
    description: Vollständiger Name des Teams.
    example: "Boston Celtics"
  city:
    type: string
    description: Stadt oder Region des Teams.
    example: "Boston"
  abbreviation:
    $ref: '../../../../common/schemas/TeamAbbreviation.yaml'
