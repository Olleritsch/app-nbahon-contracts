name: Validate OpenAPI Contracts

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Test Bundling and Spectral Linting
        run: npm test

      - name: Checkout main for Breaking Change Check
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch
        continue-on-error: true

      - name: Check for Breaking Changes with oasdiff
        id: check-breaking
        run: |
          # 1. Connector Interface Breaking Change Check (nur prüfen, wenn base ebenfalls v2 ist)
          CONNECTOR_BASE=""
          if [ -f "main-branch/contracts/connectors/interface/v2/openapi.yaml" ]; then
            CONNECTOR_BASE="main-branch/contracts/connectors/interface/v2/openapi.yaml"
          fi

          if [ -n "$CONNECTOR_BASE" ] && [ -f "contracts/connectors/interface/v2/openapi.yaml" ]; then
            echo "Checking Connector Interface against base ($CONNECTOR_BASE)..."
            npx @redocly/cli bundle "$CONNECTOR_BASE" -o dist/connector-base.yaml
            npx @redocly/cli bundle contracts/connectors/interface/v2/openapi.yaml -o dist/connector-revision.yaml
            docker run --rm -v $(pwd):/work:ro tufin/oasdiff -base /work/dist/connector-base.yaml -revision /work/dist/connector-revision.yaml -breaking -fail-on-diff
          fi

          # 2. Core BFF Breaking Change Check (falls auf main vorhanden)
          if [ -f "main-branch/contracts/core/v1/openapi.yaml" ] && [ -f "contracts/core/v1/openapi.yaml" ]; then
            echo "Checking Core BFF against base..."
            npx @redocly/cli bundle main-branch/contracts/core/v1/openapi.yaml -o dist/core-base.yaml
            npx @redocly/cli bundle contracts/core/v1/openapi.yaml -o dist/core-revision.yaml
            docker run --rm -v $(pwd):/work:ro tufin/oasdiff -base /work/dist/core-base.yaml -revision /work/dist/core-revision.yaml -breaking -fail-on-diff
          fi
