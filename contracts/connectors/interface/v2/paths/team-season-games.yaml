get:
  summary: Alle Saisonspiele eines NBA-Teams abrufen
  description: Liefert sämtliche Partien (Stammdaten und Ergebnisse) eines NBA-Teams innerhalb der angegebenen Saison.
  operationId: getTeamSeasonGames
  tags:
    - Teams
  parameters:
    - name: abbreviation
      in: path
      required: true
      description: Kanonisches 3-Buchstaben-Kürzel des NBA-Teams (z. B. CHI, HOU, BOS).
      schema:
        $ref: '../../../../common/schemas/TeamAbbreviation.yaml'
    - name: season
      in: path
      required: true
      description: NBA-Saisonjahr (Endjahr der Saison, z. B. 2027 für die Saison 2026/27).
      schema:
        type: integer
        minimum: 1947
        maximum: 2100
        example: 2027
  responses:
    '200':
      description: Erfolgreiche Rückgabe der Saisonspiele des Teams.
      content:
        application/json:
          schema:
            $ref: '../schemas/TeamSeasonGames.yaml'
    '400':
      description: Ungültiges Team-Kürzel oder ungültige Saison (ProblemDetail RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/ProblemDetail.yaml'
    '500':
      description: Unerwarteter interner Serverfehler (ProblemDetail RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/ProblemDetail.yaml'
