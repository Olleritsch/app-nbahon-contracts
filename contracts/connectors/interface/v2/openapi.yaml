openapi: 3.1.0
info:
  title: nbahon Connector Interface API Contracts
  version: 2.0.0
  description: Standardisiertes Downstream-Connector-Interface (SPI) des nbahon-Ökosystems. Jeder Konnektor implementiert dieses Interface als Anti-Corruption Layer.
  contact:
    name: Oliver (@Olleritsch)
servers:
  - url: http://localhost:8080
    description: Lokale Entwicklung

tags:
  - name: Gamedays
    description: Endpunkte zur Abfrage von NBA-Spieltagen und Partien
  - name: Games
    description: Endpunkte zur Abfrage von Spieldetails, Boxscores und Play-by-Play-Daten
  - name: Teams
    description: Endpunkte zur Abfrage von NBA-Teams

paths:
  /api/gamedays/{date}:
    $ref: './paths/gameday.yaml'
  /api/gamedays/{date}/games/{matchup}:
    $ref: './paths/game.yaml'
  /api/gamedays/{date}/games/{matchup}/boxscore:
    $ref: './paths/boxscore.yaml'
  /api/gamedays/{date}/games/{matchup}/playbyplay:
    $ref: './paths/playbyplay.yaml'
  /api/teams:
    $ref: './paths/teams.yaml'

components:
  schemas:
    Gameday:
      $ref: './schemas/Gameday.yaml'
    Game:
      $ref: './schemas/Game.yaml'
    GameStatus:
      $ref: './schemas/GameStatus.yaml'
    Team:
      $ref: './schemas/Team.yaml'
    Venue:
      $ref: './schemas/Venue.yaml'
    Score:
      $ref: './schemas/Score.yaml'
    ProblemDetail:
      $ref: './schemas/ProblemDetail.yaml'
    TeamGameStats:
      $ref: './schemas/TeamGameStats.yaml'
    PlayerBoxscore:
      $ref: './schemas/PlayerBoxscore.yaml'
    Boxscore:
      $ref: './schemas/Boxscore.yaml'
    PlayByPlay:
      $ref: './schemas/PlayByPlay.yaml'
