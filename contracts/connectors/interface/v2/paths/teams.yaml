get:
  summary: Liste aller NBA-Teams abrufen
  description: Liefert alle 30 aktiven NBA-Franchises.
  operationId: getTeams
  tags:
    - Teams
  parameters:
    - name: conference
      in: query
      required: false
      description: Filtert die Teams nach Conference (Eastern oder Western).
      schema:
        type: string
        enum:
          - Eastern
          - Western
  responses:
    '200':
      description: Erfolgreiche Rückgabe der Teams.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/Team.yaml'
    '400':
      description: Ungültige Anfrage (ProblemDetail RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/ProblemDetail.yaml'
    '500':
      description: Unerwarteter interner Serverfehler (ProblemDetail RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/ProblemDetail.yaml'
