post:
  summary: Spiel auf Serien- und Form-Spannungsfaktoren (Streaks & Head-to-Head) vor Tip-Off untersuchen
  description: Analysiert die bisherigen Saisonspiele beider Teams sowie den direkten Vergleich (spoilerfrei vor dem angegebenen Spieltag) auf aktive Sieg-/Niederlagenserien, Heim-/Auswärtsserien, Last-10-Momentum und Head-to-Head-Dominanz.
  operationId: evaluateStreak
  tags:
    - Evaluations
  requestBody:
    required: true
    description: Spieltag, beteiligte Teams und historische Saisonspiele zur Ermittlung der Serien-Konstellation.
    content:
      application/json:
        schema:
          $ref: '../schemas/StreakEvaluationRequest.yaml'
  responses:
    '200':
      description: Erfolgreiche Auswertung der StreakEvaluation.
      content:
        application/json:
          schema:
            $ref: '../schemas/StreakEvaluation.yaml'
    '400':
      description: Ungültige oder unvollständige Eingabedaten im Request-Body (ProblemDetail RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '../../../connectors/interface/v2/schemas/ProblemDetail.yaml'
    '500':
      description: Unerwarteter interner Serverfehler (ProblemDetail RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '../../../connectors/interface/v2/schemas/ProblemDetail.yaml'
