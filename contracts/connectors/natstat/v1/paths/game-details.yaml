get:
  summary: Spieldetails für ein bestimmtes Matchup abrufen
  description: Liefert Metadaten, Spielstatus, Scores und Boxscore-Zusammenfassung für eine Paarung (z.B. DET@MIA) an einem bestimmten Spieltag.
  operationId: getGameByMatchup
  tags:
    - Games
  parameters:
    - name: date
      in: path
      required: true
      description: Kalendertag des Spieltags im Format YYYY-MM-DD.
      schema:
        type: string
        format: date
        example: "2026-04-12"
    - name: matchup
      in: path
      required: true
      description: Matchup-Kürzel im Format AWAY@HOME (z.B. DET@MIA).
      schema:
        type: string
        pattern: '^[A-Za-z]{2,4}@[A-Za-z]{2,4}$'
        example: "DET@MIA"
  responses:
    '200':
      description: Erfolgreiche Rückgabe der Spieldetails.
      content:
        application/vnd.nbahon.v1+json:
          schema:
            $ref: '../schemas/GameDetails.yaml'
        application/json:
          schema:
            $ref: '../schemas/GameDetails.yaml'
    '400':
      description: Ungültiges Datums- oder Matchup-Format (ProblemDetail RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/ProblemDetail.yaml'
    '404':
      description: Spiel oder Matchup an diesem Datum nicht gefunden (ProblemDetail RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/ProblemDetail.yaml'
    '500':
      description: Unerwarteter interner Serverfehler (ProblemDetail RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/ProblemDetail.yaml'
