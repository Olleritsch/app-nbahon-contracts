openapi: 3.1.0
info:
  title: nbahon Core BFF API Contracts
  version: 1.4.0
  description: Zentrale Frontend-Facing BFF-Schnittstelle des nbahon-Ökosystems.
  contact:
    name: Oliver (@Olleritsch)
servers:
  - url: http://localhost:8080
    description: Lokale Entwicklung
tags:
  - name: Core Gamedays
    description: Spieltagsdaten für Frontend-Clients
  - name: Core Games
    description: Detailansichten einzelner Partien
paths:
  /api/core/gamedays/{date}:
    $ref: './paths/gamedays.yaml'
  /api/core/gamedays/{date}/games/{matchup}:
    $ref: './paths/games.yaml'
components:
  schemas:
    Gameday:
      $ref: './schemas/Gameday.yaml'
    Game:
      $ref: './schemas/Game.yaml'
    Team:
      $ref: './schemas/Team.yaml'
    TeamAbbreviation:
      $ref: '../../common/schemas/TeamAbbreviation.yaml'
    Score:
      $ref: './schemas/Score.yaml'
    GameEvaluations:
      $ref: './schemas/GameEvaluations.yaml'
    EvaluationSummary:
      $ref: './schemas/EvaluationSummary.yaml'
    EvaluationRating:
      $ref: './schemas/EvaluationRating.yaml'
    ProblemDetail:
      $ref: './schemas/ProblemDetail.yaml'
