get:
  summary: Spiel abrufen
  description: Liefert die Spieldetails einer Partie inkl. Boxscore.
  operationId: getGame
  tags:
    - Core Games
  parameters:
    - name: date
      in: path
      required: true
      description: Kalendertag des Spieltags im Format YYYY-MM-DD.
      schema:
        type: string
        format: date
        example: '2026-10-21'
    - name: matchup
      in: path
      required: true
      description: Matchup-Identifier im Format AWAY@HOME (z.B. MIA@BOS).
      schema:
        type: string
        pattern: '^[A-Z]{2,4}@[A-Z]{2,4}$'
        example: 'MIA@BOS'
    - name: withEvaluations
      in: query
      required: false
      description: Steuert, ob für das Spiel direkt Evaluationen ausgeführt werden sollen (Standard ist true).
      schema:
        type: boolean
        default: true
  responses:
    '200':
      description: Spieldetails erfolgreich ermittelt.
      content:
        application/json:
          schema:
            $ref: '../schemas/Game.yaml'
    '400':
      description: Ungültige Parameter.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/ProblemDetail.yaml'
    '404':
      description: Spiel für diesen Spieltag und Matchup nicht gefunden.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/ProblemDetail.yaml'
    '500':
      description: Interner Serverfehler.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/ProblemDetail.yaml'
    '502':
      description: Downstream-Konnektor nicht erreichbar.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/ProblemDetail.yaml'
